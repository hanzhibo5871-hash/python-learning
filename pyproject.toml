[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learnctl"
version = "0.1.0"
description = "前端开发者的本地 Python 学习进度 CLI"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.100", "uvicorn[standard]>=0.23", "httpx>=0.24"]

[tool.setuptools.package-data]
learnctl = ["web/static/*.html", "web/static/*.js", "web/static/*.css"]

[tool.setuptools.packages.find]
include = ["learnctl*"]

[tool.pytest.ini_options]
testpaths = ["tool_tests"]
addopts = "-ra"
