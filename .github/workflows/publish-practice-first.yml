name: Apply reviewed practice-first changes
on:
  push:
    branches: [fix/practice-first-curriculum]
    paths: ['.ci/practice-first/**']
permissions:
  contents: read
jobs:
  apply-and-test:
    if: github.repository == 'hanzhibo5871-hash/python-learning' && github.ref == 'refs/heads/fix/practice-first-curriculum'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply reviewed source with exact-file hash checks
        shell: python
        run: |
          import base64, bz2, hashlib, json
          from pathlib import Path
          parts = [Path(f'.ci/practice-first/part-{i}.txt') for i in range(6)]
          raw = bz2.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '711de537ba5a1283c3d5709ff21ae00cafbdcafd492c2bbe5e3c669c6490bf21', 'Transfer checksum mismatch'
          records = json.loads(raw)
          allowed = {'AGENTS.md','README.md','docs/learning-path.md','docs/practice-first.md','learnctl/contract_checks.py','learnctl/curriculum.py','learnctl/experiments.py','learnctl/practice.py','learnctl/practice_first_schema.py','learnctl/web/server.py','learnctl/web/static/app.js','learnctl/web/static/styles.css','learnctl/workflow.py','pyproject.toml','scripts/browser_smoke.py','scripts/build_curriculum_v3.py','scripts/practice_first_content.py','start_learning.bat','tool_tests/test_curriculum.py','tool_tests/test_practice.py','tool_tests/test_practice_first.py','tool_tests/test_web.py'}
          assert len(records) == len(allowed) and {r['path'] for r in records} == allowed
          outputs = []
          for record in records:
              path = Path(record['path'])
              if record['old'] is None:
                  assert not path.exists(), f'Unexpected existing file: {path}'
                  old = b''
              else:
                  old = path.read_bytes()
                  assert hashlib.sha256(old).hexdigest() == record['old'], f'Base changed: {path}'
              lines = old.decode('utf-8').splitlines(keepends=True)
              for start, stop, replacement in reversed(record['edits']):
                  lines[start:stop] = replacement.splitlines(keepends=True)
              content = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(content).hexdigest() == record['new'], f'Result checksum: {path}'
              outputs.append((path, content))
          for path, content in outputs:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
          # Final regression found a second equivalent-falsy gap: keep it only as a demo.
          path = Path('scripts/practice_first_content.py')
          text = path.read_text(encoding='utf-8')
          before = "('D02-bool-none', 0), ('D03-if', 0)"
          assert text.count(before) == 1
          path.write_text(text.replace(before, "('D02-bool-none', 0), ('D02-bool-none', 1), ('D03-if', 0)"), encoding='utf-8')
          for name in ['AGENTS.md','README.md','docs/practice-first.md']:
              path = Path(name)
              path.write_text(path.read_text(encoding='utf-8').replace('125','124'), encoding='utf-8')
          Path('/tmp/changed-files.json').write_text(json.dumps(sorted(allowed | {'data/curriculum.json'})))
      - name: Install dependencies and validate generated course
        run: |
          python -m pip install -e '.[dev]'
          python scripts/build_curriculum_v3.py
          python -c "from learnctl.curriculum import load_curriculum; from pathlib import Path; c=load_curriculum(Path('data/curriculum.json')); print(len(c['tasks']), 'tasks validated')"
          python -m compileall -q learnctl scripts
          node --check learnctl/web/static/app.js
      - name: Commit source changes to the repair branch only
        shell: python
        run: |
          import json, subprocess, os
          from pathlib import Path
          def run(*args): return subprocess.check_output(args, text=True).strip()
          assert os.environ['GITHUB_REF'] == 'refs/heads/fix/practice-first-curriculum'
          run('git','config','user.name','github-actions[bot]')
          run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          files = json.loads(Path('/tmp/changed-files.json').read_text())
          run('git','add','--',*files)
          run('git','commit','-m','feat: make D01-D28 practice-first with observable results and aligned validators')
          print('PUBLISHED_SOURCE_SHA=' + run('git','rev-parse','HEAD'))
          print(run('git','push','origin','HEAD:fix/practice-first-curriculum'))
      - name: Full repository regression on the published source
        run: python -m pytest -q tool_tests | tee /tmp/pytest-report.txt
      - name: Check generator is deterministic
        run: |
          python scripts/build_curriculum_v3.py
          git diff --exit-code -- data/curriculum.json
      - name: Browser regression on the actual local HTTP server
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/browser_smoke.py --screenshots /tmp/learnctl-browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: practice-first-validation
          path: |
            /tmp/pytest-report.txt
            /tmp/learnctl-browser
          retention-days: 7
