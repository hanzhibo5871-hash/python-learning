name: Temporary D09 editing snapshot
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  apply-d09:
    if: github.head_ref == 'codex/d09-step-by-step' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply exact verified source patch
        run: |
          python - <<'PY'
          import base64, bz2, hashlib, pathlib, subprocess
          parts = [pathlib.Path(f'.github/d09-patch-{i:02d}.b64').read_text().strip() for i in range(1, 5)]
          # Recover the single extra transport character only when the complete
          # original chunk Git hash matches. Never apply an unverified patch.
          if len(parts[2]) == 8193:
              s = parts[2]
              parts[2] = next(c for i in range(len(s)) if hashlib.sha1(b'blob 8193\0' + ((c := s[:i] + s[i+1:]) + '\n').encode()).hexdigest() == 'c2a98bddffa25c834a7f878889ac449fb1bd0a0e')
          packed = ''.join(parts)
          patch = bz2.decompress(base64.b64decode(packed, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'b38d178e29f46fc0e2f80ceaca5b1ad41b4bcbf4bc7d08720c45a7b5c8931c3d', 'Source patch integrity mismatch'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
      - run: python scripts/build_curriculum_v3.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tool_tests/test_d09_course.py tool_tests/test_curriculum.py tool_tests/test_curriculum_build.py tool_tests/test_short_teaching.py
      - name: Commit only course sources and generated output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- AGENTS.md README.md data/curriculum.json docs/d09-step-by-step.md docs/learning-path.md docs/practice-first.md docs/short-teaching.md learnctl/d09_checks.py learnctl/practice.py learnctl/web/static/teaching-catalog.js scripts/browser_smoke.py scripts/build_curriculum_v3.py scripts/d09_course.py tool_tests/test_curriculum.py tool_tests/test_curriculum_build.py tool_tests/test_d09_course.py tool_tests/test_practice_first.py tool_tests/test_web.py
          git diff --cached --check
          git commit -m 'feat(curriculum): rebuild D09 as 11 progressive lessons with 22 drills'
          git push origin HEAD:refs/heads/codex/d09-step-by-step
      - run: git archive --format=zip --output=/tmp/d09-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d09-verified-source
          path: /tmp/d09-source.zip
          retention-days: 1
